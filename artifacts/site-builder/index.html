<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="HTML 파일을 업로드하면 즉시 고유 링크로 접속 가능한 사이트 호스팅 플랫폼." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="SiteDrop - HTML 사이트 호스팅" />
    <meta property="og:description" content="HTML 파일을 업로드하면 즉시 고유 링크로 접속 가능한 사이트 호스팅 플랫폼." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SiteDrop - HTML 사이트 호스팅" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <style>#replit-pill,#replit-badge-container,#replit-badge,.replit-badge,[data-replit-badge],[data-state="brand"],[data-state="cta"]{display:none!important;opacity:0!important;pointer-events:none!important;}</style>
    <script>(function(){var SEL='#replit-pill,#replit-badge-container,#replit-badge,.replit-badge,[data-replit-badge],[data-state="brand"],[data-state="cta"]';function isBadge(n){return n&&n.nodeType===1&&(n.id==='replit-pill'||n.id==='replit-badge-container'||n.id==='replit-badge'||n.classList&&(n.classList.contains('replit-badge'))||n.hasAttribute&&(n.hasAttribute('data-replit-badge')||n.getAttribute('data-state')==='brand'||n.getAttribute('data-state')==='cta'));}function kill(n){if(isBadge(n)){n.remove();return;}if(n&&n.querySelectorAll){n.querySelectorAll(SEL).forEach(function(e){e.remove();});}}var _ac=Element.prototype.appendChild;Element.prototype.appendChild=function(c){if(isBadge(c))return c;var r=_ac.apply(this,arguments);kill(c);return r;};var _ib=Element.prototype.insertBefore;Element.prototype.insertBefore=function(c){if(isBadge(c))return c;var r=_ib.apply(this,arguments);kill(c);return r;};var _aa=Element.prototype.append;Element.prototype.append=function(){for(var i=0;i<arguments.length;i++){if(isBadge(arguments[i]))return;}return _aa.apply(this,arguments);};kill(document.documentElement);new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){kill(n);});});}).observe(document.documentElement,{childList:true,subtree:true});setInterval(function(){kill(document.documentElement);},300);}());</script>
  </body>
</html>
