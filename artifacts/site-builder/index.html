    <script>(function(){var IDS=['replit-pill','replit-badge-container','replit-badge','replit-dev-banner'];var SEL='#replit-pill,#replit-badge-container,#replit-badge,#replit-dev-banner,.replit-badge,[data-replit-badge],[data-state="brand"],[data-state="cta"],iframe[src*="replit.com/badge"],iframe[src*="replit.com/pill"],[class*="replit-badge"],[id*="replit"]';function nukeRoot(root){if(!root)return;IDS.forEach(function(id){var e=root.getElementById?root.getElementById(id):null;if(e)e.remove();});try{root.querySelectorAll(SEL).forEach(function(e){e.remove();});}catch(ex){}}function nuke(){nukeRoot(document);try{document.querySelectorAll('*').forEach(function(el){try{if(el.shadowRoot)nukeRoot(el.shadowRoot);}catch(ex){}});}catch(ex){}}var _ce=document.createElement.bind(document);document.createElement=function(t){var el=_ce(t);var origSetAttr=el.setAttribute.bind(el);el.setAttribute=function(k,v){if(k==='id'&&IDS.indexOf(v)!==-1){setTimeout(function(){if(el.parentNode)el.remove();},0);}return origSetAttr(k,v);};return el;};['appendChild','insertBefore','append','insertAdjacentElement'].forEach(function(m){var orig=Element.prototype[m];if(orig)Element.prototype[m]=function(){var r=orig.apply(this,arguments);nuke();return r;};});var origIH=Element.prototype.insertAdjacentHTML;if(origIH)Element.prototype.insertAdjacentHTML=function(){var r=origIH.apply(this,arguments);nuke();return r;};new MutationObserver(function(){nuke();}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['id','class','src','data-state','data-replit-badge']});(function loop(){nuke();requestAnimationFrame(loop);})();setInterval(nuke,100);}());</script>
