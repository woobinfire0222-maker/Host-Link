kind = "web"
previewPath = "/"
title = "SiteDrop - HTML 사이트 호스팅"
version = "1.0.0"
id = "artifacts/site-builder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21692

[services.development]
run = "pnpm --filter @workspace/site-builder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/site-builder", "run", "build" ]
publicDir = "artifacts/site-builder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21692"
BASE_PATH = "/"
